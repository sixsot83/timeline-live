<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimelineLive - Participante</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="student-body">

    <!-- Pantalla de Ingreso -->
    <div class="student-card" id="join-screen">
        <div class="kahoot-logo">⏱️ TimelineLive</div>
        <h2>¡Únete al Reto!</h2>
        <div class="form-group" style="margin-top: 20px;">
            <input type="text" id="student-name" placeholder="Tu Nombre y Apellido" required style="text-align: center; font-weight: bold;">
        </div>
        <button class="btn btn-primary btn-block" onclick="joinGame()" style="margin-top: 15px; background: var(--kahoot-green);">¡OK, Vamos!</button>
        
        <div class="student-footer">
            Autor: Sixto Manuel Sotomayor García
        </div>
    </div>

    <!-- Pantalla de Pregunta Activa -->
    <div class="student-card hidden" id="game-screen">
        <div id="timer-display" class="timer-circle">30</div>
        <span id="event-badge" style="font-weight: 700; color: #666; text-transform: uppercase; font-size: 0.85rem;">Fase Actual</span>
        <h3 id="question-text" style="margin-top: 10px; font-size: 1.2rem;">Cargando pregunta...</h3>

        <div class="student-options" id="options-container">
            <!-- Botones dinámicos de colores -->
        </div>
    </div>

    <!-- Pantalla de Feedback / Respuesta -->
    <div class="student-card hidden" id="feedback-screen">
        <h2 id="feedback-title" style="font-size: 1.8rem;">¡Respuesta Registrada!</h2>
        <div id="feedback-icon" class="status-icon">⏳</div>
        <p id="feedback-msg" style="color: #666; font-weight: 600;">Esperando la validación del instructor...</p>
    </div>

    <script src="js/app-student.js"></script>
</body>
</html>
